<header class="site-header">
  <nav class="nav-left">
    <a href="{{ home_href }}"{% if page == 'index' %} aria-current="page"{% endif %}>alzze</a>
    <span class="sep" aria-hidden="true">›</span>
    <a href="{{ about_href }}"{% if page == 'about' %} aria-current="page"{% endif %}>about</a>
  </nav>
  <nav class="nav-right">
    <div class="lang-wrapper">
      <button class="icon-btn lang-toggle" type="button" aria-label="{% if lang == 'es' %}Cambiar idioma{% else %}Change language{% endif %}" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M4 5h7"/>
          <path d="M7 4c0 4.846 0 7 .5 8"/>
          <path d="M10 8.5c0 2.286 -2 4.5 -3.5 4.5s-2.5 -1.135 -2.5 -2c0 -2 1 -3 3 -3s5 .57 5 2.857c0 1.524 -.667 2.571 -2 3.143"/>
          <path d="M12 20l4 -9l4 9"/>
          <path d="M19.1 18h-6.2"/>
        </svg>
      </button>
      <ul class="lang-dropdown">
        <li><a href="{{ en_href }}" data-lang="en"{% if lang == 'en' and page != 'post' %} class="active"{% endif %}>English</a></li>
        <li><a href="{{ es_href }}" data-lang="es"{% if lang == 'es' and page != 'post' %} class="active"{% endif %}>Español</a></li>
      </ul>
    </div>
    <a href="https://x.com/alzzeat" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="X / Twitter">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
        <path d="M3 4l11.733 16h4.267l-11.733 -16z"/>
        <path d="M3 20l6.768 -6.768m2.46 -2.46l6.772 -6.772"/>
      </svg>
    </a>
  </nav>
</header>
