<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title> {{ post["title"]}} - alzze</title>
  <meta name="description" content="alzze personal blog" />
  <meta name="author" content='alzze' />
  <meta name="view-transition" content="same-origin">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon.png">
  <script src="/script.js"></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav-left">
      <a href="/">alzze</a>
      <span class="separator">/</span>
      <a href="https://btc.alzze.xyz" target="_blank">bitcoin-journey</a>
    </nav>
    <nav class="nav-right">
      <div class="lang-wrapper">
        <button class="icon-btn lang-toggle" type="button" aria-label="Change language" aria-expanded="false">
          <svg style="width: 22px; height: 22px;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-language-hiragana">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M4 5h7" />
            <path d="M7 4c0 4.846 0 7 .5 8" />
            <path d="M10 8.5c0 2.286 -2 4.5 -3.5 4.5s-2.5 -1.135 -2.5 -2c0 -2 1 -3 3 -3s5 .57 5 2.857c0 1.524 -.667 2.571 -2 3.143" />
            <path d="M12 20l4 -9l4 9" />
            <path d="M19.1 18h-6.2" />
          </svg>
        </button>
        <ul class="lang-dropdown">
          <li><a href="/posts/{{ post['slug']}}" data-lang="en">English</a></li>
          <li><a href="/es/posts/{{post['slug']}}" data-lang="es">Español</a></li>
        </ul>
      </div>
      <a href="https://x.com/alzzeat" target="_blank" class="icon-btn" aria-label="X / Twitter">
        <svg xmlns="http://www.w2.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path stroke="none" d="M-1 0h24v24H0z" fill="none"/>
          <path d="M3 4l11.733 16h4.267l-11.733 -16z"/>
          <path d="M3 20l6.768 -6.768m2.46 -2.46l6.772 -6.772"/>
        </svg>
      </a>
    </nav>
  </header>
  <main>
    <div class="post-hero">
      <img src="{{ post['image']}}" style="view-transition-name: post-image-{{post['slug']}};" alt="{{ post['slug']}} main image">
      <div class="post-meta">
        <h1>{{ post["title"] }}</h1>
        <a href="http://x.com/alzzeat" target="_blank" class="author">
          <img src="/img/profile-image.jpg" alt="profile-image">
          alzze
        </a>
      </div>
    </div>
    <article>
      {{ post["content"] }}
    </article>
  </main>
  <footer>
    <a href="mailto:alzzeat+contact@gmail.com">alzzeat+contact@gmail.com</a>
  </footer>
</body>
</html>
